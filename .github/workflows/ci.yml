name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the source-URL and deployed-sitemap checks only (see `content-urls`).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The website: static, no database, no secrets. Everything `pnpm gate` runs,
  # then the build and the browser tests against the built site.
  verify-web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fails on a high/critical advisory. Accepted residuals live in
      # pnpm-workspace.yaml `auditConfig.ignoreGhsas`, each with a reason and a
      # review date, so a known issue can only stay green by being declared in a diff.
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Gate (typecheck, lint, tests, every guard)
        run: pnpm gate
      - name: Content guard self-test
        run: pnpm content-lint:test
      - name: Build
        run: pnpm build
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E (public site, accessibility, security headers)
        run: pnpm --filter web test:e2e:ci

  # The app. Analyze and test only: a release build needs the owner's signing key,
  # which never lives in CI. The golden fixtures it loads are the same files
  # `verify-web` runs against the TypeScript twins, so a change in either language
  # that breaks agreement fails here or there.
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test (golden fixtures, screens, dates)
        run: flutter test

  # Citation link rot is a slow, silent failure on health content. This resolves
  # every source URL in every draft weekly and on demand, kept out of the PR path
  # so a guideline body's WAF or a timeout never blocks an unrelated change. The
  # sitemap check reads the DEPLOYED sitemap, the only place that failure is visible.
  content-urls:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve every source URL
        run: pnpm content-lint:urls
      - name: Production sitemap check
        run: pnpm sitemap-check
