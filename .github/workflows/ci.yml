name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for the source-URL check only (see the `content-urls` job).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholder public env so the build never depends on real secrets.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails on a high/critical advisory in any workspace package. Accepted
      # residuals live in pnpm-workspace.yaml `auditConfig.ignoreGhsas`, each with
      # a written reason + review date — so a known issue can only stay green by
      # being declared in a diff (P1.23 / SECURITY_REVIEW A06).
      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Claims-language guard
        run: pnpm claims-lint

      - name: Crisis-safety compliance guard
        run: pnpm crisis-lint

      - name: Analytics privacy guard
        run: pnpm analytics-lint

      # A namespace used by a client component but missing from CLIENT_NAMESPACES is not
      # a build error — it is a runtime error in someone's browser (P1.11.2).
      - name: Client i18n payload guard
        run: pnpm i18n-client-lint

      # A whole namespace left in English renders fine and passes key-parity, so
      # only a value comparison catches it — three of them shipped that way for
      # months (P1.29, ADR-053).
      - name: Untranslated-copy guard
        run: pnpm i18n-untranslated-lint

      # A Tailwind utility with no theme entry emits nothing — no error, just the
      # wrong result on screen. `rounded-round` did exactly that (ADR-054).
      - name: Token/preset parity guard
        run: pnpm tokens-parity-lint

      # The tracker has to stay buildable without a server or Phase 4 cannot ship
      # (P4.0). A ratchet over known violations, not a gate — see docs/21.
      - name: Native readiness guard
        run: pnpm native-readiness-lint

      # Personas must reach the screen as DATA, never as a branch in JSX — the
      # failure docs/23 §3.1 found, where 73 personas collapsed into four hardcoded
      # modes. A ratchet: the legacy mode-branch list can shrink, never grow
      # (ADR-061).
      - name: Persona-branch guard
        run: pnpm persona-branch-lint

      # Tier 1 has to lift into a Deno Edge Function and be mirrored in Dart
      # unchanged (docs/24 §1). Nothing in the web app breaks when that stops being
      # true, which is exactly why it is checked rather than remembered (ADR-060).
      - name: Tier-1 portability guard
        run: pnpm tier1-portability-lint

      # The authoring brief, enforced mechanically over docs/content/articles
      # (P1.9.1, ADR-031). Offline by default — source URLs are resolved by the
      # scheduled `content-urls` job below, so a guideline body's WAF or a slow
      # response can never fail an unrelated PR.
      - name: Content guard
        run: pnpm content-lint

      # A guard nobody has watched fail is indistinguishable from no guard, so the
      # guard's own rules are tested: each is handed an article built to violate it.
      - name: Content guard self-test
        run: pnpm content-lint:test

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # DB-free e2e (home, crisis, axe a11y) against the built app via `next start`.
      # @live specs (real Supabase auth/sync) stay a local gate — see playwright.config.ts.
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: E2E (DB-free) + accessibility
        run: pnpm --filter web test:e2e:ci

  verify-cms:
    runs-on: ubuntu-latest
    env:
      # Placeholder Payload env — the CMS build does not connect to the DB.
      DATABASE_URL: postgresql://user:pass@localhost:5432/femio
      PAYLOAD_SECRET: ci-placeholder-secret-not-used-at-build-time
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck (cms)
        run: pnpm --filter cms typecheck
      # Covers the Markdown → Lexical converter and the importer's refusal paths
      # (P1.9.2). Runs in dry-run mode, which returns before Payload is imported,
      # so it never touches a database — the placeholder env above is enough.
      - name: Importer self-test
        run: pnpm content-import:test
      - name: Build (cms)
        run: pnpm --filter cms build

  # Citation link rot is a slow, silent failure on health content: a source that
  # 404s undermines the page it supports, and nobody notices by reading. This
  # resolves every source URL in every draft, weekly and on demand — kept out of
  # the PR path on purpose, so an unrelated change is never blocked by a guideline
  # body's WAF, a timeout, or a rate limit.
  content-urls:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve every source URL
        run: pnpm content-lint:urls
      # Looks at the DEPLOYED sitemap, because that is the only place the failure it
      # guards against is visible: NEXT_PUBLIC_CMS_URL is unset in CI, so CI's own
      # sitemap correctly contains no articles. Production once served a 200 sitemap
      # with every article missing, cached for an hour (P1.6.18).
      - name: Production sitemap check
        run: pnpm sitemap-check
