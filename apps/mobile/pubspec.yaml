name: femio
description: "Femio: your cycle, your plans, your pregnancy. Private, on your phone."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.4

# Pinned exactly. Every package here works offline; none opens a socket. The
# privacy tripwire (scripts/analytics-lint.mjs) fails the gate if an analytics,
# crash-reporting, ads or database package ever appears in this list.
#   path_provider          where the record file lives
#   flutter_secure_storage the record's encryption key, in the Android Keystore
#   cryptography           AES-GCM for the record and backups, PBKDF2 for passphrases and the PIN
#   file_picker            the backup file she saves and opens herself (Storage Access Framework)
#   flutter_local_notifications  the optional reminders, scheduled on the phone itself (R4.4)
#   timezone               the TZDateTime type the notification plugin schedules with (no database loaded)
#   in_app_purchase        Google Play Billing for femio Plus (R6.9): talks to the Play Store app on the
#                          device, never to the network; the merged manifest must stay free of INTERNET
#   google_mobile_ads      the AdMob banners on the guide screens only (ADR-076): non-personalised, no
#                          keywords or content URL, Google's consent form first; the one package allowed
#                          to bring INTERNET, and nothing about her record is ever passed to it
dependencies:
  cryptography: 2.9.0
  file_picker: 13.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  google_mobile_ads: 9.2.0
  in_app_purchase: 3.3.1
  intl: any # the version flutter_localizations pins
  path_provider: 2.1.6
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # The guide library, built by scripts/content/build-content.mjs from the same
  # Markdown the website reads (content-build-lint keeps it current).
  assets:
    - assets/content/
    - assets/trusted_sources/
  # Bundled, never fetched: the app makes no network request for fonts (D7). All OFL;
  # the licences sit beside the files.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
