name: femio_app
description: Femio – Privacy-first period and pregnancy tracker for MENA women
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  
  # Dependency Injection
  get_it: ^7.7.0
  
  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  
  # Secure Storage
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Firebase(aligned / stable)
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.2
  firebase_crashlytics: ^5.0.7
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  
  # Ads
  google_mobile_ads: ^5.1.0
  
  # In-App Purchases
  in_app_purchase: ^3.2.0
  
  # Localization
  intl: any  # Version managed by flutter_localizations
  
  # Charts
  fl_chart: ^0.68.0
  
  # UI Components
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  
  # Utilities
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  share_plus: ^12.0.1
  url_launcher: ^6.3.0
  in_app_review: ^2.0.9
  package_info_plus: ^8.2.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  pdf: ^3.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  json_serializable: ^6.8.0
  
  # Testing
  mocktail: ^1.0.4
  
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/pregnancy/
    - assets/postpartum/
    - assets/content/
