<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Femio app icon">
  <title>Femio — launcher icon, premium Dusk Bloom. Source for the Android launcher and the Play store icon only (web uses femio-app-icon-dusk.svg).</title>
  <!-- Why this file exists: the Android adaptive icon had drifted to a flat plum
       square with a small bloom. This keeps the approved Bloom mark but restores
       the rich gradient ground, a warm glow behind the flower and larger, crafted
       petals. scripts/brand/generate-launcher-icon.mjs reads it and splits it into
       layers by the ids "bg" (ground) and "bloom" (flower). -->
  <defs>
    <radialGradient id="dusk" cx="70%" cy="22%" r="100%">
      <stop offset="0" stop-color="#D27AB2"/>
      <stop offset=".4" stop-color="#7A2A63"/>
      <stop offset="1" stop-color="#34102B"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#EE6A8C" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#C56EA7" stop-opacity=".14"/>
      <stop offset="1" stop-color="#C56EA7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="20" x2="0" y2="-212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE6A8C"/><stop offset=".5" stop-color="#F7B394"/><stop offset="1" stop-color="#F0C979"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="20" x2="0" y2="-212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8F1" stop-opacity="0"/><stop offset=".6" stop-color="#FFF8F1" stop-opacity=".34"/><stop offset="1" stop-color="#FFF8F1" stop-opacity=".1"/>
    </linearGradient>
    <path id="p" d="M0,20 C40,-48 40,-144 0,-212 C-40,-144 -40,-48 0,20 Z"/>
    <path id="v" d="M0,6 C13,-52 13,-132 0,-190 C-13,-132 -13,-52 0,6 Z"/>
  </defs>
  <g id="bg">
    <rect width="512" height="512" fill="url(#dusk)"/>
    <circle cx="256" cy="256" r="250" fill="url(#glow)"/>
  </g>
  <g id="bloom" transform="translate(256,256) scale(0.96)">
    <g fill="url(#petal)">
      <use href="#p" opacity=".88" transform="rotate(60)"/>
      <use href="#p" opacity=".88" transform="rotate(180)"/>
      <use href="#p" opacity=".88" transform="rotate(300)"/>
      <use href="#p" opacity="1"/>
      <use href="#p" opacity="1" transform="rotate(120)"/>
      <use href="#p" opacity="1" transform="rotate(240)"/>
    </g>
    <g fill="url(#vein)">
      <use href="#v"/><use href="#v" transform="rotate(60)"/><use href="#v" transform="rotate(120)"/>
      <use href="#v" transform="rotate(180)"/><use href="#v" transform="rotate(240)"/><use href="#v" transform="rotate(300)"/>
    </g>
    <circle r="40" fill="#FFF8F1"/>
    <circle r="22" fill="#6B2558"/>
  </g>
</svg>
