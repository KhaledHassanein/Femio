<svg width="360" height="96" viewBox="0 0 360 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Femio">
  <title>Femio — logo (concept, v1)</title>
  <defs>
    <linearGradient id="femioDawn" x1="10" y1="72" x2="66" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#E11D74"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- MARK: "the continuum" — an open cycle ring (life is continuous, never closed/fixed),
       with a today-marker dot echoing the app's cycle-ring UI. -->
  <g transform="translate(20,20)">
    <!-- full soft cycle ring -->
    <circle cx="28" cy="28" r="20" fill="none" stroke="#E7E4EC" stroke-width="6"/>
    <!-- tracked arc: gradient, round caps, deliberately NOT a full circle (uncertainty-honest, open, non-restrictive) -->
    <circle cx="28" cy="28" r="20" fill="none" stroke="url(#femioDawn)" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="79 47" transform="rotate(-96 28 28)"/>
    <!-- today / "you" marker at 12 o'clock -->
    <circle cx="28" cy="8" r="5.5" fill="#7C3AED"/>
    <circle cx="28" cy="8" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- WORDMARK: Fraunces (editorial warmth + authority). Concept lockup — outline before handoff. -->
  <text x="96" y="60" font-family="Fraunces, Georgia, serif" font-size="46" font-weight="600"
        letter-spacing="-0.5" fill="#1E1B2E">Femio</text>
</svg>
