<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Femio — Venus mark">
  <title>Femio — Venus continuum</title>
  <defs>
    <linearGradient id="dawnV" x1="28" y1="56" x2="68" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/><stop offset=".55" stop-color="#E11D74"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Unmistakably women's health: the Venus symbol, reinterpreted.
       The ring is an OPEN cycle (uncertainty-honest, never closed/fixed) with a today dot. -->
  <circle cx="48" cy="36" r="20" fill="none" stroke="#E7E4EC" stroke-width="6"/>
  <circle cx="48" cy="36" r="20" fill="none" stroke="url(#dawnV)" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="84 42" transform="rotate(-100 48 36)"/>
  <circle cx="48" cy="16" r="5" fill="#7C3AED"/>
  <circle cx="48" cy="16" r="2" fill="#FFFFFF"/>
  <!-- Soft rounded cross — feminine, geometric, not clinical -->
  <g stroke="#7C3AED" stroke-width="7" stroke-linecap="round">
    <line x1="48" y1="58" x2="48" y2="82"/>
    <line x1="37" y1="71" x2="59" y2="71"/>
  </g>
</svg>
