<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Femio — Bloom mark">
  <title>Femio — Bloom (cycle petals)</title>
  <defs>
    <linearGradient id="dawn" x1="14" y1="82" x2="82" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#E11D74"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Six petals = a blossom AND the cycle turning: life blooming, phases, continuity.
       Shared dawn gradient (violet-raspberry-amber) so each petal catches a different hue. -->
  <g transform="translate(48,48)" fill="url(#dawn)">
    <path d="M0,3 C8,-10 8,-28 0,-40 C-8,-28 -8,-10 0,3 Z" opacity=".95" transform="rotate(0)"/>
    <path d="M0,3 C8,-10 8,-28 0,-40 C-8,-28 -8,-10 0,3 Z" opacity=".88" transform="rotate(60)"/>
    <path d="M0,3 C8,-10 8,-28 0,-40 C-8,-28 -8,-10 0,3 Z" opacity=".95" transform="rotate(120)"/>
    <path d="M0,3 C8,-10 8,-28 0,-40 C-8,-28 -8,-10 0,3 Z" opacity=".88" transform="rotate(180)"/>
    <path d="M0,3 C8,-10 8,-28 0,-40 C-8,-28 -8,-10 0,3 Z" opacity=".95" transform="rotate(240)"/>
    <path d="M0,3 C8,-10 8,-28 0,-40 C-8,-28 -8,-10 0,3 Z" opacity=".88" transform="rotate(300)"/>
  </g>
  <!-- Soft center + today/"you" marker (echoes the app cycle-ring UI) -->
  <circle cx="48" cy="48" r="8" fill="#FFFFFF"/>
  <circle cx="48" cy="48" r="6" fill="#7C3AED"/>
  <circle cx="48" cy="48" r="2.4" fill="#FFFFFF"/>
</svg>
