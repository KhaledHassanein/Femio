<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Femio — Lune mark">
  <title>Femio — Lune (moon cycle + bloom)</title>
  <defs>
    <linearGradient id="dawnL" x1="18" y1="80" x2="78" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#E11D74"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="96" height="96" fill="#FFFFFF"/>
      <circle cx="58" cy="40" r="22" fill="#000000"/>
    </mask>
  </defs>
  <!-- Lunar crescent = the menstrual/lunar cycle; soft feminine curve.
       Three waxing dots = phases/life stages progressing. -->
  <circle cx="48" cy="48" r="25" fill="url(#dawnL)" mask="url(#crescent)"/>
  <circle cx="70.5" cy="30.5" r="3.2" fill="#F59E0B"/>
  <circle cx="78" cy="42" r="2.4" fill="#E11D74" opacity=".9"/>
  <circle cx="79.5" cy="55" r="1.8" fill="#7C3AED" opacity=".8"/>
</svg>
