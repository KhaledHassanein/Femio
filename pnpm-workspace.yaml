packages:
  - "apps/*"
  - "packages/*"
  - "assets/brand/tokens"

# Approve trusted native build scripts (pnpm 11 blocks postinstall by default).
# esbuild — bundler binary; sharp — Next image optimization; unrs-resolver — ESLint resolver.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
